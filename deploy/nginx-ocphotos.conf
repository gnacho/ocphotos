# ocphotos PWA served same-origin under cloud.example.com/ocphotos/
#
# Where this goes: appended inside the `server { }` block of the Nginx Proxy
# Manager proxy host for cloud.example.com (the vhost on the proxy host), before the
# final `location / { }`.
#
# The static files live on the NPM host at /data/ocphotos (owned by www-data).
#
# `^~` is required: NPM includes a global regex location
# (/data/nginx/custom/server_proxy.conf) that proxies every .js/.css request to
# the upstream. Without `^~`, that regex would win over this prefix location and
# the app assets would be proxied to OpenCloud instead of served from disk.
#
# Reload: kill -HUP $(cat /usr/local/openresty/nginx/logs/nginx.pid)
# (nginx-proxy-manager runs openresty; there is no `systemctl reload`.)

location = /ocphotos { return 301 /ocphotos/; }

location ^~ /ocphotos/ {
    root /data;
    # .webmanifest is not in the default mime map; give it the right type
    # without overriding the inherited js/css mappings.
    default_type application/manifest+json;
    try_files $uri $uri/ /ocphotos/index.html;
    add_header Strict-Transport-Security $hsts_header always;
}
