name: Release

on:
  push:
    tags:
      - 'ocphotos-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: ocphotos/pnpm-lock.yaml

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME##*-v}"
          PKG_VERSION=$(node -p "require('./ocphotos/package.json').version")
          echo "tag=${TAG_VERSION} ocphotos/package.json=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} declares ${TAG_VERSION} but ocphotos/package.json says ${PKG_VERSION}. Bump the version before tagging: the build copies package.json into manifest.json, and OpenCloud shows that version in the apps menu."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ocphotos
        run: pnpm install

      - name: Build
        working-directory: ocphotos
        run: pnpm build

      - name: Package
        run: |
          TAG=${GITHUB_REF_NAME}
          APP=${TAG%-v*}
          VERSION=${TAG##*-v}
          MANIFEST_VERSION=$(node -p "require('./ocphotos/dist/manifest.json').version")
          echo "tag=${VERSION} dist/manifest.json=${MANIFEST_VERSION}"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::The built manifest declares ${MANIFEST_VERSION} but the tag says ${VERSION}. Refusing to publish an asset whose manifest disagrees with its file name."
            exit 1
          fi
          mkdir -p "apps/${APP}"
          cp -r ocphotos/dist/. "apps/${APP}/"
          cd apps
          zip -r "../${APP}-${VERSION}.zip" "${APP}/"
          cd ..
          ls -la *.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          generate_release_notes: true
